<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrainDesk – Góc nhìn thị trường ngũ cốc</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Chakra+Petch:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07100b;--glass:rgba(22,40,30,.55);--line:rgba(120,200,150,.14);--green:#3ddc84;--red:#ff6b6b;--gold:#e8b84a;--txt:#eef5f0;--mute:#8fa89a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;color:var(--txt);min-height:100vh;
 background:radial-gradient(1200px 600px at 10% -10%,#163a26 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#1b2f12 0%,transparent 55%),var(--bg)}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace}
.app{max-width:1360px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);padding:22px}
/* LEFT */
.left{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px;align-self:start}
.topbar{display:flex;justify-content:space-between;align-items:center}
.logo{display:inline-flex;align-items:center;gap:12px;padding:6px 18px 6px 8px;border-radius:16px;background:linear-gradient(135deg,#07130d 0%,rgba(22,45,32,.85) 55%,rgba(45,20,22,.7) 100%);border:1px solid rgba(232,184,74,.5);box-shadow:0 0 26px rgba(61,220,132,.18),0 0 26px rgba(255,92,92,.12)}
.logo .bb-pair{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:12px;background:#050c08;border:1px solid rgba(255,255,255,.12)}
.logo .bb-ic{width:34px;height:34px;border-radius:8px;object-fit:cover;display:block}
.logo .bb-ic.bull{box-shadow:0 0 10px rgba(61,220,132,.45);border:1px solid rgba(61,220,132,.45)}
.logo .bb-ic.bear{box-shadow:0 0 10px rgba(255,92,92,.45);border:1px solid rgba(255,92,92,.45)}
.logo .zap{font-size:14px;filter:drop-shadow(0 0 6px var(--gold));margin:0 1px}
.logo .brand-wrap{display:flex;flex-direction:column;line-height:1.05}
.logo .brand{font-family:'Chakra Petch',sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(90deg,#3ddc84 0%,#fff 45%,var(--gold) 75%,#ff6b6b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo .brand-sub{font-size:.62rem;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);opacity:.9;margin-top:2px}
.imp{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 10px 3px 5px;border-radius:999px;border:1px solid transparent}
.imp.up{background:#3ddc841c;border-color:#3ddc8445}
.imp.down{background:#ff6b6b1c;border-color:#ff6b6b45}
.imp.wait{background:rgba(232,184,74,.14);border-color:rgba(232,184,74,.45);color:var(--gold);padding:3px 10px}
.imp img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid currentColor}
.ev-time{font-size:10.5px;color:var(--gold);margin-top:2px}
.vlink{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid rgba(61,220,132,.5);background:rgba(61,220,132,.15);color:var(--green);font-weight:600}
.vlink.wait{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--mute);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#fff;padding:8px 18px;border-radius:999px;border:1px solid rgba(255,77,109,.8);background:linear-gradient(135deg,#ff0050 0%,#ff4d6d 55%,#00f2fe 140%);box-shadow:0 0 22px rgba(255,0,80,.6),0 0 40px rgba(0,242,254,.25);animation:heartbeat 1.45s ease-in-out infinite;transform-origin:center}
.pill:hover{filter:brightness(1.15);box-shadow:0 0 30px rgba(255,0,80,.9),0 0 50px rgba(0,242,254,.5)}
@keyframes heartbeat{
 0%,100%{transform:scale(1);box-shadow:0 0 18px rgba(255,0,80,.55)}
 14%{transform:scale(1.09);box-shadow:0 0 32px rgba(255,0,80,.95),0 0 48px rgba(0,242,254,.45)}
 28%{transform:scale(1);box-shadow:0 0 18px rgba(255,0,80,.55)}
 42%{transform:scale(1.06);box-shadow:0 0 28px rgba(255,0,80,.85),0 0 40px rgba(0,242,254,.35)}
 70%{transform:scale(1);box-shadow:0 0 18px rgba(255,0,80,.55)}
}
h2{font-size:28px;font-weight:700}
.sub{color:var(--mute);font-size:13px;margin-top:-10px}
.feed{display:flex;flex-direction:column;gap:12px}
.ev{display:flex;gap:14px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.28);transition:.25s}
.ev:hover{border-color:rgba(61,220,132,.5);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.thumb{position:relative;flex-shrink:0;width:96px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background-size:cover;background-position:center}
.ev.big .thumb{width:150px;aspect-ratio:3/4}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.7))}
.play{position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);color:#000;display:grid;place-items:center;font-size:12px;z-index:1}
.views{position:absolute;bottom:6px;left:8px;font-size:10px;z-index:1}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid}
.t-ngo{color:var(--gold);border-color:#e8b84a55;background:#e8b84a14}
.t-dau{color:var(--green);border-color:#3ddc8455;background:#3ddc8414}
.t-mi{color:#e7a76b;border-color:#e7a76b55;background:#e7a76b14}
.t-dvu{color:#7fc8ff;border-color:#7fc8ff55;background:#7fc8ff14}
.imp{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
.up{color:var(--green)}.down{color:var(--red)}
.imp.up{background:#3ddc8420}.imp.down{background:#ff6b6b20}
.ev h3{font-size:16px;margin:6px 0 4px;line-height:1.3}
.ev.big h3{font-size:20px}
.ev ul{list-style:none;font-size:13px;color:#cfdcd4}
.ev li::before{content:"• ";color:var(--mute)}
.more{margin-top:auto;padding-top:6px;font-size:12.5px;color:var(--mute)}
.ev:hover .more{color:var(--green)}
/* CTA */
.cta{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.cta-box{border-radius:16px;padding:16px;border:1px solid var(--line);background:rgba(0,0,0,.3)}
.cta-box b{display:block;font-size:15px}.cta-box small{color:var(--mute);font-size:12px}
.tt{background:linear-gradient(135deg,#111,#1c1c1c);display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:.2s}
.tt:hover{border-color:#ff2d55}
.tt .go{font-size:13px;font-weight:600;color:#ff4d6d}
.mail{background:linear-gradient(135deg,rgba(31,107,66,.55),rgba(61,220,132,.18));border-color:rgba(61,220,132,.45);box-shadow:0 0 40px rgba(61,220,132,.15)}
.mail form{display:flex;gap:6px;margin-top:10px}
.mail input{flex:1;min-width:0;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font:inherit;font-size:13px;outline:none}
.mail input:focus{border-color:var(--green)}
.mail button{background:var(--green);color:#04210f;border:0;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 0 18px rgba(61,220,132,.5)}
/* RIGHT */
.right{display:flex;flex-direction:column;gap:20px}
.bento{display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.tile{border-radius:18px;padding:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(30,55,40,.6),rgba(0,0,0,.35));display:flex;flex-direction:column;transition:.2s;min-height:150px}
.tile:hover{border-color:rgba(61,220,132,.45)}
.tile.hero{grid-row:span 2}
.tile .nm{font-size:13px;color:#cfdcd4;display:flex;justify-content:space-between}
.tile .px{font-size:26px;font-weight:700;margin:6px 0 2px}
.tile.hero .px{font-size:34px}
.tile .ch{font-size:12px;font-weight:700;display:inline-block;padding:2px 8px;border-radius:8px;width:max-content}
.tile svg{margin-top:auto;width:100%;height:50px}
.tile.hero svg{height:55%}
.unit{font-size:11px;color:var(--mute)}
.tile .nm{align-items:flex-start}
.ttl{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.ttl b{display:inline-block;font-size:1.1rem;font-weight:800;color:#fff;line-height:1.2;padding:5px 14px;border-radius:999px;border:1.5px solid rgba(232,184,74,.55);background:rgba(232,184,74,.1)}
.tile.hero .ttl b{font-size:1.35rem;padding:6px 18px}
.ttl em{font-style:normal;font-size:.72rem;color:var(--gold);letter-spacing:1px;padding-left:4px}
.tf{font-size:.7rem;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:#cfdcd4}
.px small{font-size:.75rem;color:var(--mute);margin-left:6px;font-weight:500}
.axis{display:flex;justify-content:space-between;font-size:.62rem;color:var(--mute);margin-top:4px}
.tile:not(.hero) .axis span:nth-child(2){display:none}
.bottom{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}
.panel h4{font-size:17px}.panel .cap{font-size:12px;color:var(--mute);margin-bottom:14px}
.week .it{position:relative;padding:0 0 14px 18px;border-left:1px dashed var(--line);margin-left:4px}
.week .it::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.week .it:last-child{padding-bottom:0}
.week .d{font-size:11px;color:var(--gold)}
.week .t{font-size:14px;font-weight:600}
.week .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:76px repeat(12,1fr);gap:3px;font-size:11px;align-items:center}
.cal .m{text-align:center;color:var(--mute);font-size:10px}
.cal .c{height:22px;border-radius:4px;background:rgba(255,255,255,.04)}
.cal .p{background:linear-gradient(#3ddc84,#23a862)}.cal .h{background:linear-gradient(#f2c862,#d49c2a)}
.cal .now{outline:1.5px solid #fff;outline-offset:1px}
.leg{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.disc{font-size:11px;color:var(--mute);text-align:center;grid-column:1/-1;padding-top:4px}
/* DESKTOP: full width, fill screen, balanced */
@media(min-width:981px){
 html{font-size:clamp(14px,0.95vw,18px)}
 .app{max-width:none;width:100%;height:100vh;overflow:hidden;padding:clamp(14px,1.4vw,28px);gap:clamp(12px,1.2vw,22px);grid-template-columns:1fr 1.25fr;grid-template-rows:minmax(0,1fr);align-items:stretch}
 .left{position:static;align-self:stretch;min-height:0;gap:clamp(8px,1.2vh,16px);padding:clamp(14px,1.4vw,24px)}
 .feed{flex:1;min-height:0;gap:clamp(8px,1.2vh,14px)}
 .ev{flex:1;min-height:0;padding:clamp(8px,1.2vh,14px);align-items:stretch}
 .ev.big{flex:1.35}
 .thumb,.ev.big .thumb{width:clamp(120px,10vw,190px);aspect-ratio:auto;height:auto;min-height:0}
 .ev h3{font-size:1rem;margin:4px 0 3px}.ev.big h3{font-size:1.18rem}
 .ev ul{font-size:.82rem;line-height:1.42}.more{font-size:.8rem}
 h2{font-size:1.65rem}
 .cta-box{padding:clamp(10px,1.4vh,16px)}
 .right{gap:clamp(12px,1.2vw,22px);min-height:0;display:flex;flex-direction:column}
 .bento{flex:1.02;min-height:0}
 .tile{min-height:0;overflow:hidden}
 .bottom{flex:1.08;min-height:0;gap:clamp(12px,1.2vw,22px);grid-template-columns:1.25fr 1fr}
 .bottom .panel{min-height:0;overflow:hidden;padding:clamp(12px,1.2vw,18px);display:flex;flex-direction:column}
 .bottom .panel .cap{margin-bottom:8px;font-size:.75rem}
 .disc{flex:none;padding:0;font-size:.72rem}
 .tile .px{font-size:2rem}.tile.hero .px{font-size:3rem}
 .tile .nm{font-size:.95rem}.tile .ch{font-size:.85rem}
 .tile svg{height:40%}.tile.hero svg{height:60%}
 .week>#week{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
 .week .it{padding:0 0 0 15px}
 .week .d{font-size:.72rem;line-height:1.2}
 .week .t{font-size:.88rem;line-height:1.25;margin:1px 0 3px}
 .week .tags{margin-top:2px;gap:4px}
 .week .tag{font-size:.66rem;padding:1px 7px}
 .cal{flex:1;min-height:0;grid-template-columns:64px repeat(12,1fr);grid-template-rows:auto;grid-auto-rows:minmax(0,1fr);font-size:.74rem;gap:2.5px}
 .cal .c{height:100%;min-height:12px}
 .leg{margin-top:6px;font-size:.7rem}
 .panel h4{font-size:1.1rem}
}
/* MOBILE */
@media(max-width:980px){
 .app{grid-template-columns:1fr;padding:14px;gap:14px}
 .left{position:static}
 .right{display:contents}
 .left{order:1}.bento{order:2}.bottom{order:3}.disc{order:4}
 .bottom{grid-template-columns:1fr;gap:14px}
 .bento{grid-template-columns:1fr 1fr;grid-template-rows:auto}
 .tile.hero{grid-column:span 2;grid-row:auto;min-height:190px}
 .tile.hero svg{height:70px}
 .cta{grid-template-columns:1fr}
 .ev.big .thumb{width:110px}
 h2{font-size:24px}
}
</style>
</head>

</div>

<script>

document.getElementById("ttTop").href=TIKTOK;

const OEMBED_CACHE={};
function enrichTikTok(url,cb){
 if(!url||!url.includes("/video/")||OEMBED_CACHE[url]){if(OEMBED_CACHE[url])cb(OEMBED_CACHE[url]);return;}
 fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(url)).then(r=>r.ok?r.json():null).then(j=>{

function renderEvents(list){
 document.getElementById("feed").innerHTML=list.map((e,i)=>{
  const badge=e.hasVideo
   ?`<span class="imp ${e.impact}"><img src="${e.impact=='up'?'bull.jpg':'bear.jpg'}" alt="">${e.impact=='up'?'BULL · DỰ BÁO TĂNG ▲':'BEAR · DỰ BÁO GIẢM ▼'}</span>`
   :`<span class="imp wait">⏳ CHỜ VIDEO NHẬN ĐỊNH</span>`;
  return `<a class="ev ${i==0?'big':''}" id="evcard-${e.key||i}" href="${e.video||TIKTOK}" target="_blank">
   <div class="thumb" id="thumb-${e.key||i}" style="background-image:url('${e.img}')"><span class="play">▶</span><span class="views mono">${e.views}</span></div>
   <div class="body">
    <div class="row"><span class="tag t-${e.tag}">${e.tagName||TAGN[e.tag]||e.tag}</span>${badge}</div>
    ${e.timeStr?`<div class="ev-time mono">⏰ ${e.timeStr}</div>`:''}
    <h3>${e.title}</h3><ul>${e.points.filter(Boolean).map(p=>`<li>${p}</li>`).join("")}</ul>
    <span class="more">${e.hasVideo?'▶ Xem video dự báo & phân tích chart trên TikTok →':'♪ Follow @wayturtles để xem nhận định ngay khi lên sóng →'}</span>
   </div></a>`;
 }).join("");
 // Tự động lấy ảnh bìa & tiêu đề thật từ link video TikTok nếu có
 list.forEach((e,i)=>{
  if(e.video&&e.video.includes("/video/")){
   enrichTikTok(e.video,meta=>{
    const el=document.getElementById("thumb-"+(e.key||i));
    if(el&&meta.thumbnail_url)el.style.backgroundImage=`url('${meta.thumbnail_url}')`;
   });
  }
 });
}

function spark(d,up,id){const w=200,h=60,mn=Math.min(...d),mx=Math.max(...d);
 const pts=d.map((v,i)=>[i*w/(d.length-1),h-4-(v-mn)/(mx-mn||1)*(h-8)]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const c=up?'#3ddc84':'#ff6b6b';
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
 <path d="${line} L${w} ${h} L0 ${h}Z" fill="url(#g${id})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}

function demo1D(p){const end=parseFloat(p.price),start=end/(1+p.ch/100),n=48,a=[];
 for(let i=0;i<n;i++){const t=i/(n-1);a.push(start+(end-start)*t+Math.sin(i*1.7+end)*Math.abs(end-start)*0.35*(1-t*0.6))}return a}

function renderPrices(list){
 const hero=list.reduce((a,b,i)=>Math.abs(b.ch)>Math.abs(list[a].ch)?i:a,0);
 document.getElementById("bento").innerHTML=[list[hero],...list.filter((_,i)=>i!=hero)].map((p,i)=>{const up=p.ch>=0;
  const d=(p.intraday&&p.intraday.length>1)?p.intraday:demo1D(p);
  return `<div class="tile ${i==0?'hero':''}">
   <div class="nm"><span class="ttl"><b>${p.name}</b><em class="mono">${p.code} · CBOT</em></span><span class="tf mono">1D</span></div>
   <div class="px mono">${p.price}<small>${p.unit}</small></div>
   <span class="ch mono ${up?'up':'down'}" style="background:${up?'#3ddc8420':'#ff6b6b20'}">${up?'▲ +':'▼ '}${Number(p.ch).toFixed(2)}%</span>
   ${spark(d,up,i)}
   <div class="axis mono"><span>08:00</span><span>Mở cửa phiên CBOT</span><span>Hiện tại</span></div></div>`}).join("");
}

function autoUpcomingEvents(now=new Date()){
 // Tạo lịch báo cáo chuẩn của USDA / EIA / CFTC / NOPA theo giờ Việt Nam (UTC+7)
 // Quy tắc giờ chuẩn (Standard Time tháng 11–tháng 3):
 // - USDA Export Inspections: Thứ 2 hàng tuần · 23:00
 // - USDA Crop Progress: Thứ 3 hàng tuần · 04:00 (tức 16:00 ET Thứ 2)
 // - EIA Ethanol Production: Thứ 4 hàng tuần · 22:30 (10:30 ET)
 // - USDA Weekly Export Sales: Thứ 5 hàng tuần · 20:30 (08:30 ET)
 // - CFTC COT Report: Thứ 7 hàng tuần · 03:30 (15:30 ET Thứ 6)
 // - NOPA Crush Report: Ngày 15 hàng tháng · 23:00
 // - USDA WASDE Report: Khoảng ngày 10–12 hàng tháng · 23:00
 const rules=[
  {key:"INSPECT",type:"w",dow:1,h:23,m:0,t:"USDA Export Inspections (Giao hàng xuất khẩu)",tags:["ngo","dau","mi"]},
  {key:"CROP",type:"w",dow:2,h:4,m:0,t:"USDA Crop Progress (Tiến độ mùa vụ Mỹ)",tags:["ngo","dau","mi"]},
  {key:"EIA",type:"w",dow:3,h:22,m:30,t:"EIA Ethanol Report (Sản lượng & tồn kho Ethanol)",tags:["ngo","dvu"]},
  {key:"EXPORT",type:"w",dow:4,h:20,m:30,t:"USDA Weekly Export Sales (Doanh số xuất khẩu)",tags:["ngo","dau","mi","dvu"]},
  {key:"COT",type:"w",dow:6,h:3,m:30,t:"CFTC COT Report (Vị thế quỹ đầu cơ Managed Money)",tags:["ngo","dau","mi","dvu"]},
  {key:"WASDE",type:"m",dom:10,h:23,m:0,t:"Báo cáo Cung – Cầu Thế giới USDA WASDE",tags:["ngo","dau","mi","dvu"]},
  {key:"NOPA",type:"m",dom:15,h:23,m:0,t:"NOPA Crush Report (Sản lượng ép dầu đậu tương Mỹ)",tags:["dau","dvu"]},
 ];
 const list=[];
 for(let i=0;i<=35;i++){
  const d=new Date(now.getTime()+i*86400000);
  const dow=d.getDay(),dom=d.getDate();
  for(const r of rules){
   if((r.type=="w"&&dow==r.dow)||(r.type=="m"&&dom==r.dom)){
    const evTime=new Date(d.getFullYear(),d.getMonth(),d.getDate(),r.h,r.m,0);
    if(evTime>now)list.push({key:r.key,dt:evTime,t:r.t,tags:r.tags});
   }
  }
 }
 list.sort((a,b)=>a.dt-b.dt);
 const thu=["Chủ Nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
 const pad=n=>String(n).padStart(2,"0");
 return list.slice(0,4).map(x=>{
  const dt=x.dt;
  const diffH=Math.max(1,Math.round((dt-now)/3600000));
  const cd=diffH<24?`còn ${diffH} giờ`:`còn ${Math.ceil(diffH/24)} ngày`;
  const dStr=`${thu[dt.getDay()]} · ${pad(dt.getDate())}/${pad(dt.getMonth()+1)}/${dt.getFullYear()} · ${pad(dt.getHours())}:${pad(dt.getMinutes())} (${cd})`;
  return {key:x.key,d:dStr,cd,t:x.t,tags:x.tags};
 });
}

function buildLinkedFeed(upcoming){
 // Nối 3 sự kiện sắp tới gần nhất sang cột "Góc nhìn sự kiện" (mỗi sự kiện hiển thị 1 mặt hàng tâm điểm)
 return upcoming.slice(0,3).map(u=>{
  const cfg=EVENT_VIDEOS[u.key]||{};
  const mainTag=cfg.focus||u.tags[0]||"ngo";
  const hasVideo=Boolean(cfg.video&&cfg.video.trim());
  const defaultPts=hasVideo
   ?["Xem kịch bản dự báo biến động giá & phân tích đồ thị chi tiết trên video TikTok"]
   :[`Dự báo tác động lên giá ${TAGN[mainTag]} & phân tích chart sẽ lên sóng trước giờ ra tin`,`Theo dõi kênh @wayturtles để cập nhật kịch bản giao dịch`];
  return {
   key:u.key,
   tag:mainTag,
   tagName:TAGN[mainTag]||mainTag,
   impact:cfg.impact||"up",
   title:cfg.title||u.t,
   timeStr:u.d,
   points:(cfg.points&&cfg.points.length)?cfg.points:defaultPts,
   video:hasVideo?cfg.video:TIKTOK,
   hasVideo,
   img:cfg.img||FALLBACK_IMG[mainTag],
   views:hasVideo?"🎬 Đã có video":"⏳ Chờ lên sóng"
  };
 });
}

 function renderWeek(list){
 document.getElementById("week").innerHTML=list.map(w=>{
  const cfg=EVENT_VIDEOS[w.key]||{};
  const focusTag=cfg.focus||w.tags[0]||"ngo";
  const hasV=Boolean(cfg.video);
  const badge=hasV
   ?`<a class="vlink" href="${cfg.video}" target="_blank">▶ Xem video góc nhìn</a>`
   :`<a class="vlink wait" href="${TIKTOK}" target="_blank">⏳ Sắp có video</a>`;
  return `<div class="it"><div class="d mono">${w.d}</div><div class="t">${w.t}</div>
   <div class="tags"><span class="tag t-${focusTag}">${TAGN[focusTag]||focusTag}</span>${badge}</div></div>`;
 }).join("");
}

function syncAll(){
 const up=autoUpcomingEvents();
 renderWeek(up);
 renderEvents(buildLinkedFeed(up));
}

// Khởi tạo bằng dữ liệu tự động thời gian thực (tự đồng bộ 2 cột)
renderPrices(PRICES);syncAll();
setInterval(syncAll,60000);

// 1) Tự động nạp giá từ prices.json (do GitHub Actions cập nhật)
fetch("prices.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.prices&&j.prices.length)renderPrices(j.prices)}).catch(()=>{});

// 2) Tự động nạp Góc nhìn sự kiện & Sự kiện tuần từ Google Sheets
function loadSheet(tab,cb){
 if(!SHEET_ID)return;
 fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`)
  .then(r=>r.text()).then(t=>{
   const rows=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)).table.rows;
   cb(rows.map(r=>(r.c||[]).map(c=>c&&c.v!=null?String(c.v).trim():"")));
  }).catch(()=>{});
}
loadSheet("events",rows=>{
 let changed=false;
 rows.filter(r=>r[0]&&r[0].toLowerCase()!="key"&&r[0].toLowerCase()!="tag").forEach(r=>{
  const k=r[0].toUpperCase();
  if(EVENT_VIDEOS[k]){
   if(r[1])EVENT_VIDEOS[k].impact=r[1].toLowerCase();
   if(r[2])EVENT_VIDEOS[k].video=r[2];
   const pts=[r[3],r[4]].filter(Boolean);
   if(pts.length)EVENT_VIDEOS[k].points=pts;
   if(r[5])EVENT_VIDEOS[k].img=r[5];
   changed=true;
  }
 });
 if(changed)syncAll();
});
