name: Update CBOT Prices

on:
  schedule:
    - cron: "*/30 * * * 1-5"   # Mỗi 30 phút từ Thứ 2 -> Thứ 6
  workflow_dispatch:            # Cho phép bấm chạy tay bất cứ lúc nào

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch latest prices
        run: python update_prices.py
      - name: Commit & push if changed
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "chore: update prices" && git push)
